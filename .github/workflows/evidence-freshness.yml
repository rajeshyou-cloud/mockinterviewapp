name: Evidence freshness

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  evidence-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run check:evidence-links -- --concurrency=6 --timeout-ms=20000 --hash-content --fail-on-broken
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-link-health
          path: apps/web/data/evidence-link-health/latest.json
          retention-days: 30
